<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Registration Form</title>
    <link rel="stylesheet" href="styles3.css">
</head>
<body>
    <div class="container">
        <h1>
            School Registeration Form
        </h1>
        <form>
            <!--Student Information-->
            <fieldset>
                <legend><b>Student Information</b></legend>

                <div class="form group">
                    <label>Full Name</label>
                    <input type="text"placeholder="Enter full name"required>
                </div>
                <div class="form group">
                    <label>Date Of Birth</label>
                    <input type="date">
                </div>
                <div class="form group">
                    <label>Age</label>
                    <input type="number"class="min=0" max="50"placeholder="Age">
                </div>
                <div class="radio group">
                    <label>Gender</label>
                    <div class="radio group">
                        <label><input type="radio" name="gender" value="male">male</label>
                         <label><input type="radio" name="gender" value="female">female</label>
                          <label><input type="radio" name="gender" value="others">others</label>
                    </div>
                </div>
            </fieldset>
            <!--Contact Information -->
            <fieldset>
                <legend><b>Contact Information</b></legend>
                <div class="form group">
                    <label>Parent Name</label>
                    <input type="text"placeholder="Enter Parent name">
                </div>
                <div class="form group">
                    <label>phone Number</label>
                    <input type="tel"placeholder="Enter contact phone">
                </div>
                <div class="form group">
                    <label>Email</label>
                    <input type="email"placeholder="Enter email">
                </div> 
            
            </fieldset>
            <!--Address Information-->
            <fieldset>
                <legend><b>Address Information</b></legend>
                <div class="form grid">
                    <label>Street Address</label>
                    <input type="text"placeholder="Enter Full Address"required>
                </div>
                <div class="form-group">
        <label>City</label>
        <input type="text"placeholder="Enter city name"required>
    </div>
    <div class="form-group">
        <label>Country</label>
        <select>
            <option value="">Select Country</option>
            <option value="usa">United States</option>
            <option value="canada">Somalia</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option> 
        </select>   
    </div>

            </fieldset>
            <!--Academic Information-->
            <fieldset>
                <legend><b>Academic Information</b></legend>
                <div class="form group">
                    <label for="Grade">Grade</label>
                    <select name="Grade" id="Grade">
                        <option value="Grade ">Grade 1</option>
                        <option value="Grade ">Grade 2</option> 
                        <option value="Grade ">Grade 3</option> 
                        <option value="Grade ">Grade 4</option> 
                        <option value="Grade ">Grade 5</option> 
                        <option value="Grade ">Grade 6</option> 
                        <option value="Grade ">Grade 7</option> 
                        <option value="Grade ">Grade 8</option> 
                        <option value="Grade ">Grade 9</option> 
                        <option value="Grade ">Grade 10</option>
                        <option value="Grade ">Grade 11</option>
                        <option value="Grade ">Grade 12</option>   
                    </select>
                    
                </div>
                <div class="form-group">
                    <label>Previos school</label>
                     <input type="text"placeholder="Enter previous school name"required>
                </div>
                <div class="form-group">
                    <label>Favorite subject</label>
                    <select name="Favorite subject" id="Subject">
                        <option value="">Select Subject</option>
                        <option value="Math">Math</option>
                        <option value="English">English</option>
                        <option value="Science">Science</option>
                    </select>
                </div>
            

            </fieldset>

            <!--Other Information-->
            <fieldset>
                <legend><b>Other Information</b></legend>
                <div class="checkbox">
                    <label>Hobbies</label><br>
            
                <input type="checkbox" id="football">
                <label for="football">Football</label>

                <input type="checkbox" id="Reading">
                <label for="reading">Reading</label>
               
                <input type="checkbox" id="coding">
                <label for="coding">Coding</label>
               
                <input type="checkbox" id="music">
                <label for="music">Music</label>
                
                

                </div>
                <div class="radio group">
                    <label>Transportation required</label><br>
                <input type="radio" id="yes" name="transport">
                <label for="yes">Yes</label>
                <input type="radio" id="no" name="tranport">
                <label for="no">No</label>
                </div>
            </fieldset>
            <button type="submit">Register Student</button>
            <button type="reset">Clear Form</button>

        </form>
    </div>
</body>
</html>
